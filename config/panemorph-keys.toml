# paneMorph 0.2 keys. Merge into ~/.config/herdr/config.toml, then run
# `herdr config check` and `herdr server reload-config`.
#
# Your v0.1 bindings (ctrl+e, ctrl+s, ctrl+f on extract-pane, send-pane and
# bring-pane) keep working in v0.2 as aliases. Remove them before v1.0.

[[keys.command]]
key = "ctrl+alt+s"
type = "plugin_action"
command = "dev.panemorph.send"
description = "Send pane"

[[keys.command]]
key = "ctrl+alt+f"
type = "plugin_action"
command = "dev.panemorph.fetch"
description = "Fetch a pane here"

[[keys.command]]
key = "ctrl+alt+t"
type = "plugin_action"
command = "dev.panemorph.move-tab-new"
description = "Pane to a new tab"

[[keys.command]]
key = "ctrl+alt+n"
type = "plugin_action"
command = "dev.panemorph.move-space-new"
description = "Pane to a new space"

[[keys.command]]
key = "ctrl+alt+left"
type = "plugin_action"
command = "dev.panemorph.move-tab-prev"
description = "Pane one tab left"

[[keys.command]]
key = "ctrl+alt+right"
type = "plugin_action"
command = "dev.panemorph.move-tab-next"
description = "Pane one tab right"

[[keys.command]]
key = "ctrl+alt+z"
type = "plugin_action"
command = "dev.panemorph.undo"
description = "Undo the last move"

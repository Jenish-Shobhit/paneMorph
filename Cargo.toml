[package]
name = "panemorph"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "herdr plugin that moves live panes between tabs and spaces: send any pane anywhere, fetch any pane here"
authors = ["Jenish Shobhit"]
license = "MIT"
repository = "https://github.com/Jenish-Shobhit/paneMorph"
homepage = "https://github.com/Jenish-Shobhit/paneMorph#readme"
readme = "README.md"
keywords = ["herdr", "terminal", "tui", "ratatui", "pane"]
categories = ["command-line-utilities", "development-tools"]
# A herdr plugin, installed with `herdr plugin install`, not a crates.io crate.
publish = false

[[bin]]
name = "panemorph"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[dev-dependencies]
portable-pty = "0.9"
toml = "0.8"
vt100 = "0.15"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

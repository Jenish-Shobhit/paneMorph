[package]
name = "panemorph"
version = "0.2.0"
edition = "2021"
description = "Send any herdr pane anywhere. Fetch any pane here."
license = "MIT"
authors = ["Jenish Shobhit"]
repository = "https://github.com/Jenish-Shobhit/paneMorph"
rust-version = "1.89"
publish = false

[[bin]]
name = "panemorph"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
libc = "0.2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.15"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
